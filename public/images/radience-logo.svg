<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 200" width="100%" height="100%">
  <style>
    .brand-text {
      font-family: 'Brush Script MT', 'Dancing Script', 'Playfair Display', cursive, serif;
      font-size: 96px;
      font-style: italic;
      font-weight: 700;
    }
    .sub-text {
      font-family: 'Inter', sans-serif;
      font-size: 14px;
      letter-spacing: 6px;
      text-transform: uppercase;
      font-weight: 600;
    }
  </style>
  <g fill="currentColor">
    <text x="250" y="110" text-anchor="middle" className="brand-text">Radience</text>
    <path d="M 90,120 Q 250,165 410,120 Q 250,145 90,120" />
    <text x="250" y="170" text-anchor="middle" className="sub-text" fill="#c28e46">Architectural Hardware</text>
  </g>
</svg>
